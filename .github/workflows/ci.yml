name: CI

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    site:
        uses: allurx/allurx-build/.github/workflows/cloudflare-static-site.yml@e8af419cc31780e403856e40f099c03207cf6af2 # workflows-v2.2.0
        with:
            asset-directory: dist/
            production-url: https://allurx.io
        secrets: inherit
